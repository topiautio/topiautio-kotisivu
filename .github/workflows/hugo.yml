# Builds and checks the Hugo site, then deploys it to Cloudflare Pages.
# Cloudflare Pages serves the HTTP security headers from public/_headers (layouts/index.headers).
name: Deploy Hugo site to Cloudflare Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Builds pull requests without deploying them
  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Keep the build job read-only. Deployment permissions are granted only to the deploy job.
permissions:
  contents: read

# Deployments (pushes to main and manual runs) share the "pages" group: only one runs at a time, a newer
# queued run replaces an older queued one, and an in-progress production deployment is never cancelled.
# Pull request builds get their own group per PR, so they never cancel a queued deployment or another
# PR's build; a new push to the same PR cancels that PR's previous build.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HUGO_VERSION: 0.164.0
      HUGO_SHA256: 8325f3653032d0fc536503691f4833dc4eb6c6be02ee62466758f3f37a7f2fcd
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O "${RUNNER_TEMP}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          echo "${HUGO_SHA256}  ${RUNNER_TEMP}/hugo.deb" | sha256sum --check --strict
          sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        # baseURL tulee config.toml:sta (https://topiautio.fi/).
        run: scripts/build-site.sh
      - name: Install check tools
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check internal links and CSP compatibility
        run: python3 scripts/check-site.py public
      - name: Check accessibility (WCAG 2 AA)
        run: |
          export CHROME_BIN="$(command -v google-chrome)"
          scripts/check-accessibility.sh public
      - name: Capture site screenshots
        if: github.event_name == 'pull_request'
        run: |
          export CHROME_BIN="$(command -v google-chrome)"
          node scripts/capture-site-screenshots.mjs public screenshots
      - name: Upload site screenshots
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-screenshots
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload site artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: ./public
          # .well-known/security.txt alkaa pisteellä, ja se jätetään muuten pois.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Deployment job. Runs only after every check in the build job has passed.
  # The Cloudflare API token is an environment secret, so only this job (and only on main) can read it.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    environment:
      name: cloudflare-pages
      url: https://topiautio.fi/
    runs-on: ubuntu-latest
    needs: build
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: topiautio-kotisivu
      WRANGLER: wrangler@4.160.0
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: public
      - name: Create Cloudflare Pages project if missing
        run: |
          if ! npx --yes "${WRANGLER}" pages project list | grep -qw "${PAGES_PROJECT}"; then
            npx --yes "${WRANGLER}" pages project create "${PAGES_PROJECT}" --production-branch=main
          fi
      - name: Deploy to Cloudflare Pages
        run: |
          npx --yes "${WRANGLER}" pages deploy public \
            --project-name="${PAGES_PROJECT}" \
            --branch=main \
            --commit-hash="${GITHUB_SHA}" \
            --commit-dirty=false
