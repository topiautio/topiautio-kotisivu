# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Builds pull requests without deploying them
  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Keep the build job read-only. Deployment permissions are granted only to the deploy job.
permissions:
  contents: read

# Deployments (pushes to main and manual runs) share the "pages" group: only one runs at a time, a newer
# queued run replaces an older queued one, and an in-progress production deployment is never cancelled.
# Pull request builds get their own group per PR, so they never cancel a queued deployment or another
# PR's build; a new push to the same PR cancels that PR's previous build.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HUGO_VERSION: 0.164.0
      HUGO_SHA256: 8325f3653032d0fc536503691f4833dc4eb6c6be02ee62466758f3f37a7f2fcd
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O "${RUNNER_TEMP}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          echo "${HUGO_SHA256}  ${RUNNER_TEMP}/hugo.deb" | sha256sum --check --strict
          sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Setup Pages
        if: github.event_name == 'push'
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            scripts/build-site.sh \
              --baseURL "${{ steps.pages.outputs.base_url }}/"
          else
            scripts/build-site.sh
          fi
      - name: Install check tools
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check internal links and CSP compatibility
        run: python3 scripts/check-site.py public
      - name: Check accessibility (WCAG 2 AA)
        run: |
          export CHROME_BIN="$(command -v google-chrome)"
          scripts/check-accessibility.sh public
      - name: Capture site screenshots
        if: github.event_name == 'pull_request'
        run: |
          export CHROME_BIN="$(command -v google-chrome)"
          node scripts/capture-site-screenshots.mjs public screenshots
      - name: Upload site screenshots
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-screenshots
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./public
          # .well-known/security.txt alkaa pisteellä, ja se jätetään muuten pois.
          include-hidden-files: true

  # Deployment job
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
