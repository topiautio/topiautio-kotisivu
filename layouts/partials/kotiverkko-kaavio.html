{{- /*
    Kotiverkon topologia etusivun Kotipalvelin-korttiin. Kaavio on inline-SVG,
    jotta se käyttää sivuston fontteja ja värejä (luokat: static/styles.css, .network-diagram).
    Kaaviossa ei ole IP-osoitteita, verkkojen nimiä eikä sijainteja.
*/ -}}
<figure class="project-diagram">
    <div class="network-diagram" tabindex="0" role="region" aria-label="Kotiverkon topologia">
        <svg viewBox="0 0 960 400" role="img" aria-labelledby="kotiverkko-otsikko kotiverkko-kuvaus">
            <title id="kotiverkko-otsikko">Kotiverkon topologia</title>
            <desc id="kotiverkko-kuvaus">Internet-yhteys tulee GL.iNet Flint 2 -reitittimelle, joka hoitaa DHCP:n ja langattoman verkon. Reitittimeen on kaapelilla kytketty TrueNAS-palvelin, Raspberry Pi ja työpöytäkone. Reititin, palvelimet, työpöytäkone sekä läppäri ja puhelin ovat samassa Tailscale-verkossa, joten etälaitteilla pääsee kotiverkon laitteisiin WireGuard-salattua yhteyttä pitkin.</desc>

            <g aria-hidden="true">
                <path class="nd-wire" d="M200 185 H290"/>
                <text class="nd-label" x="245" y="176" text-anchor="middle">WAN</text>
                <path class="nd-wire" d="M530 185 H585 M585 58 V312 M585 58 H640 M585 185 H640 M585 312 H640"/>
                <text class="nd-label" x="557" y="176" text-anchor="middle">LAN</text>

                <path class="nd-tunnel" d="M890 58 H925 M890 185 H925 M890 312 H925 M925 58 V385 H110 V360 M410 385 V240"/>
                <circle class="nd-dot" cx="925" cy="58" r="4"/>
                <circle class="nd-dot" cx="925" cy="185" r="4"/>
                <circle class="nd-dot" cx="925" cy="312" r="4"/>
                <circle class="nd-dot" cx="410" cy="385" r="4"/>
                <circle class="nd-dot" cx="110" cy="385" r="4"/>
                <text class="nd-label" x="667" y="375" text-anchor="middle">TAILSCALE · WIREGUARD-SALATTU ETÄYHTEYS</text>

                <rect class="nd-box" x="20" y="150" width="180" height="70" rx="6"/>
                <text class="nd-title" x="110" y="191" text-anchor="middle">Internet</text>

                <rect class="nd-box" x="20" y="290" width="180" height="70" rx="6"/>
                <text class="nd-title" x="110" y="319" text-anchor="middle">Etälaitteet</text>
                <text class="nd-sub" x="110" y="341" text-anchor="middle">läppäri · puhelin</text>

                <rect class="nd-box nd-box-key" x="290" y="130" width="240" height="110" rx="6"/>
                <text class="nd-title" x="410" y="168" text-anchor="middle">GL.iNet Flint 2</text>
                <text class="nd-sub" x="410" y="192" text-anchor="middle">reititin · DHCP</text>
                <text class="nd-sub" x="410" y="213" text-anchor="middle">WLAN 2,4 / 5 GHz</text>

                <rect class="nd-box nd-box-key" x="640" y="20" width="250" height="76" rx="6"/>
                <text class="nd-title" x="765" y="52" text-anchor="middle">TrueNAS</text>
                <text class="nd-sub" x="765" y="75" text-anchor="middle">Intel N100 · tallennus · kontit</text>

                <rect class="nd-box" x="640" y="147" width="250" height="76" rx="6"/>
                <text class="nd-title" x="765" y="191" text-anchor="middle">Raspberry Pi</text>

                <rect class="nd-box" x="640" y="274" width="250" height="76" rx="6"/>
                <text class="nd-title" x="765" y="318" text-anchor="middle">Työpöytäkone</text>
            </g>
        </svg>
    </div>
    <figcaption class="scroll-hint">Vieritä kaaviota sivusuunnassa.</figcaption>
</figure>
