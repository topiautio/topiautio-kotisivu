{{- $active := .active -}}
{{- $menu := site.Menus.main -}}
<nav class="site-nav" aria-label="Päänavigaatio">
    <a class="site-mark" href="{{ site.Home.RelPermalink }}" aria-label="Topi Autio, etusivu">TA</a>

    <div class="desktop-nav">
        <ul>
            {{- range $menu }}
            <li><a href="{{ .URL | relURL }}"{{ if eq $active .Identifier }} class="active" aria-current="page"{{ end }}>{{ .Name }}</a></li>
            {{- end }}
        </ul>
    </div>

    <details class="mobile-nav">
        <summary>
            <span class="menu-icon" aria-hidden="true"><span></span><span></span><span></span></span>
            <span>Valikko</span>
        </summary>
        <div class="mobile-nav-panel">
            <ul>
                {{- range $menu }}
                <li><a href="{{ .URL | relURL }}"{{ if eq $active .Identifier }} class="active" aria-current="page"{{ end }}>{{ .Name }}</a></li>
                {{- end }}
            </ul>
        </div>
    </details>
</nav>
