baseURL = "https://topiautio.fi/"
publishDir = "public"
title = "Topi Autio"
defaultContentLanguage = "fi"
disableHugoGeneratorInject = true
disableKinds = ["taxonomy", "term"]

[languages]
  [languages.fi]
    label = "Suomi"
    locale = "fi-FI"

[params]
  author = "Topi Autio"
  description = "Topi Aution portfolio: jyväskyläläinen ICT-insinööriopiskelija, IT-tuki, järjestelmähallinta, tietoverkot ja kyberturvallisuus."
  email = "topi@topiautio.fi"
  linkedin = "https://www.linkedin.com/in/topi-a-558796240/"
  github = "https://github.com/topiautio"
  tryhackme = "https://tryhackme.com/p/TopiAutio"
  shareImage = "og-image.png"
  shareImageAlt = "Topi Autio – ICT, infra ja kyberturvallisuus"
  # Sivut eivät käytä ulkoisia resursseja eivätkä inline-skriptejä tai -tyylejä.
  # scripts/check-site.sh varmistaa buildin jälkeen, että näin on myös jatkossa.
  contentSecurityPolicy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"

[outputs]
  home = ["html"]
  section = ["html", "rss"]

[markup.highlight]
  # Koodilohkojen värit tulevat CSS-luokista (static/blogi/julkaisut/syntax.css), jotta CSP ei tarvitse inline-tyylejä.
  noClasses = false

[permalinks]
  blogi = "/blogi/julkaisut/:slug/"

[[menus.main]]
  name = "Esittely"
  identifier = "intro"
  url = "/#esittely"
  weight = 10

[[menus.main]]
  name = "Projektit"
  identifier = "projects"
  url = "/#portfolio"
  weight = 20

[[menus.main]]
  name = "CV"
  identifier = "cv"
  url = "/cv/"
  weight = 30

[[menus.main]]
  name = "Blogi"
  identifier = "blog"
  url = "/blogi/"
  weight = 40

[[menus.main]]
  name = "Yhteystiedot"
  identifier = "contact"
  url = "/#yhteystiedot"
  weight = 50
